[project]
name = "tms-backend"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = [
    "fastapi (==0.135.1)",
    "uvicorn (==0.41.0)",
    "sqlalchemy (==2.0.48)",
    "pydantic (==2.12.5)",
    "python-dotenv (==1.2.2)",
    "google-api-python-client (==2.194.0)",
    "google-auth (==2.49.2)",
    "google-auth-httplib2 (==0.3.1)",
    "openpyxl (==3.1.5)",
    "psycopg2-binary (==2.9.11)",
    "psycopg (==3.3.4)",
    "psycopg-binary (==3.3.4)",
    "psycopg-pool (==3.3.1)",
    "procrastinate (==3.9.0)",
    "requests (==2.33.1)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (==9.0.2)",
    "httpx2 (>=2.9.1,<3.0.0)"
]
